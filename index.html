    <!-- Service Worker Cache Cleanup Helper -->
    <script>
      (function() {
        try {
          const usp = new URLSearchParams(location.search);
          if (usp.get('nocache') === '1' && 'serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(async regs => {
              for (const reg of regs) {
                try { await reg.unregister(); } catch {}
              }
              if (window.caches && caches.keys) {
                const keys = await caches.keys();
                for (const k of keys) { try { await caches.delete(k); } catch {} }
              }
              const url = new URL(location.href);
              url.searchParams.delete('nocache');
              location.replace(url.toString());
            });
          }
        } catch (e) {
          console.warn('SW cleanup:', e);
        }
      })();
    </script>

    <!--
      Storefront SW kill switch.
      VitePWA registers a service worker at "/" for the admin panel.
      On custom-domain stores (anything that is NOT /admin) that SW ends up
      caching the admin bundle and, after we deploy new hashes, serves
      stale /assets/index-XYZ.{js,css} that no longer exist — producing
      CORS-blocked 404s and a white page until the user does a hard
      refresh. Here we proactively unregister any SW + clear caches when
      the user lands on a storefront route, then reload exactly once.
    -->
    <script>
      (function() {
        try {
          if (location.pathname.startsWith('/admin') || location.pathname.startsWith('/dashboard')) return;
          if (!('serviceWorker' in navigator)) return;
          navigator.serviceWorker.getRegistrations().then(async function (regs) {
            if (!regs || regs.length === 0) return;
            for (var i = 0; i < regs.length; i++) {
              try { await regs[i].unregister(); } catch (e) {}
            }
            if (window.caches && caches.keys) {
              try {
                var keys = await caches.keys();
                for (var j = 0; j < keys.length; j++) {
                  try { await caches.delete(keys[j]); } catch (e) {}
                }
              } catch (e) {}
            }
            // Reload once so the freshly-cleared SW lets through real network requests.
            if (!sessionStorage.getItem('toogo-sw-cleanup-done')) {
              sessionStorage.setItem('toogo-sw-cleanup-done', '1');
              location.reload();
            }
          });
        } catch (e) {
          console.warn('storefront SW cleanup error:', e);
        }
      })();
    </script>
    
    <!-- Auto Cache Invalidation on New Build Version -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          const buildVersion = document.querySelector('meta[name="build-version"]')?.content;
          const cachedVersion = localStorage.getItem('app-build-version');
          
          if (buildVersion && cachedVersion && buildVersion !== cachedVersion) {
            console.log('🔄 Nueva versión detectada, limpiando cachés...');
            registrations.forEach(reg => reg.unregister());
            caches.keys().then(keys => keys.forEach(key => caches.delete(key)));
            localStorage.setItem('app-build-version', buildVersion);
            window.location.reload();
          } else if (buildVersion) {
            localStorage.setItem('app-build-version', buildVersion);
          }
        });
      }
    </script>
